<style>
  :root {
    --bg: #0d1117;

  header {
    position: sticky; top: 0; z-index: 100;

    border-bottom: 1px solid var(--border);

  .header-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  h1 .sub { color: var(--text-dim); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .meta-pills { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--text-dim);

  .pill b { color: var(--accent); font-family: var(--mono); }
  .search-row { margin-top: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #search {
    flex: 1; min-width: 220px; background: var(--bg-alt); border: 1px solid var(--border);

  #search:focus { border-color: var(--accent); }
  .toc { display: flex; gap: 6px; flex-wrap: wrap; }
  .toc a {

    padding: 5px 11px; border-radius: 6px; border: 1px solid transparent;

  .section-title .dot { width: 11px; height: 11px; border-radius: 3px; }
  .section-title .count { color: var(--text-dim); font-weight: 400; font-size: 12px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;

  .card:hover { background: var(--card-hover); border-color: #3d4763; }
  .card h3 { font-size: 14px; font-family: var(--mono); font-weight: 600; margin-bottom: 6px; word-break: break-word; }
  .card .kind {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;

  .card .file { font-family: var(--mono); font-size: 11px; color: #79c0ff; margin-bottom: 6px; word-break: break-all; }

  .flow-band {

    position: absolute; top: -10px; left: 16px; background: var(--bg); padding: 0 8px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim);
  }

  .chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-family: var(--mono); font-size: 12px;

  .arrow { text-align: center; color: var(--text-dim); font-size: 18px; }

  .mod { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .mod summary {
    cursor: pointer; padding: 13px 16px; background: var(--card); list-style: none;
    display: flex; align-items: center; gap: 12px; user-select: none;

  .mod summary::-webkit-details-marker { display: none; }
  .mod summary:hover { background: var(--card-hover); }
  .mod summary .domain { font-family: var(--mono); font-weight: 600; font-size: 14px; }
  .mod summary .path { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .mod summary .badges { margin-left: auto; display: flex; gap: 6px; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--bg-alt); color: var(--text-dim); border: 1px solid var(--border); }
  .mod .body { padding: 14px 16px; border-top: 1px solid var(--border); font-size: 13px; }
  .mod .body .lbl { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; }
  .mod .body .lbl:first-child { margin-top: 0; }
  .tag { display: inline-block; font-family: var(--mono); font-size: 11px; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; margin: 2px 3px 2px 0; }
  .tag.svc { color: #7ee787; }
  .tag.rtr { color: #ffa657; }
  .note { color: var(--text-dim); font-size: 12.5px; margin-top: 8px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; color: var(--text-dim); }
  .kv { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { font-family: var(--mono); color: #79c0ff; flex-shrink: 0; min-width: 130px; word-break: break-all; }
  .kv .v { color: var(--text-dim); }
  ul.list { list-style: none; }
  ul.list li { padding: 6px 0 6px 18px; position: relative; font-size: 13px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
  ul.list li:last-child { border-bottom: none; }
  ul.list li::before { content: "▸"; position: absolute; left: 0; color: var(--accent); }
  ul.list li code { font-family: var(--mono); color: #ffa657; font-size: 12px; }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 40px; }
  a.self { color: var(--accent); text-decoration: none; }
  a.self:hover { text-decoration: underline; }

      "variants": { "full": "default", "lite": "VITE_PRODUCT_VARIANT=lite — урезанная панель", "demo": "VITE_DEMO_MODE=true — monkey-patch window.fetch с mock data" }
    },
    "mobile_app": {
      "path": "mobile/",
      "stack": ["Vue 3 + TypeScript", "Vite", "Pinia", "Vue Router", "Capacitor (Android)", "TailwindCSS 4"],
      "server_url": "https://ai-sekretar24.ru (hardcoded)",
      "size": "~77KB gzipped",
      "screens": ["LoginView", "ChatListView", "ChatView", "SettingsView"],
      "role_based": "admin → полный контроль; non-admin → shared chats + приватные per-user assistant сессии",
      "jwt": "native Preferences (не localStorage)"
    },
    "landing": {

      "note": "Статический маркетинг-сайт, без build-step; i18n ru(canonical)/en/kk; nginx /var/www/; lead form → POST /widget/lead → Telegram"
    }
  },
  "api_conventions": {
    "list_create": "GET/POST /admin/{resource}",
    "crud": "GET/PUT/DELETE /admin/{resource}/{id}",
    "actions": "POST /admin/{resource}/{id}/{action}",
    "webhooks": "POST /webhooks/{service}",
    "openai_compat": "POST /v1/chat/completions, GET /v1/models",
    "rbac": "Depends(require_permission(module, level)) — level: view|edit|manage; workspace_context → (owner_id, workspace_id); gate-check перед mutation"
  },
  "deployment": {
    "production": {
      "server": "root@155.212.231.7 (ssh ai-server)",
      "manager": "systemd (ai-secretary), НЕ Docker Compose",
      "path": "/opt/ai-secretary",
      "nginx_frontend": "/var/www/admin-ai-sekretar24/ (rsync после npm run build, НЕ admin/dist)",
      "steps": ["git pull origin main", "cd admin && npm ci && npm run build", "rsync -av --delete admin/dist/ /var/www/admin-ai-sekretar24/", "bust sw.js cache", "systemctl restart ai-secretary", "curl localhost:8002/health"],
      "webhook": "ai-secretary-webhook.service (GitHub push auto-deploy)"
    },
    "docker": {
      "gpu": "docker compose up -d",
      "cpu": "docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d",
      "full": "+ vLLM containerized",
      "vector_search": "docker compose --profile vector-search up -d (:8003)"
    },
    "ci": {
      "file": ".github/workflows/ci.yml",
      "jobs": ["lint-backend (ruff + format + mypy soft на orchestrator.py)", "lint-frontend (npm ci + eslint + build type-check)", "security (Trivy)"],
      "branch_protection": "PR workflow обязателен, никогда прямой push в main"
    }
  },
  "key_env_vars": {
    "LLM_BACKEND": "vllm или cloud:{provider_id}",
    "VLLM_API_URL": "http://localhost:11434",
    "DEPLOYMENT_MODE": "full | cloud | local",
    "ORCHESTRATOR_PORT": "8002",
    "ADMIN_JWT_SECRET": "auto-generated если пусто (рестарт инвалидирует токены)",
    "VECTOR_SEARCH_URL": "http://localhost:8003 (опционально)",
    "GOOGLE_CLIENT_ID/SECRET": "OAuth 2.0",
    "BRIDGE_ISOLATE_HOME": "1 — изолировать HOME Claude CLI",
    "PROCUREMENT_CATALOG_COLLECTIONS": "default {6}",
    "SUPPLIER_PRICES_DIR": "прайсы поставщиков (не в git)"
  },
  "known_issues": [
    "Vosk-модель обязательна для STT (models/vosk/)",
    "XTTS требует CUDA CC >= 7.0 (RTX 3060+)",
    "GPU память: vLLM ~6GB + XTTS ~5GB в 12GB",
    "VLESS proxy vs localhost — NO_PROXY для claude_bridge",
    "Claude bridge warmup 7-30s, read=300s timeout, max_tokens=4096",
    "services/bridge/src/models/ gitignored (pattern models/)",
    "Docker CPU: whisper исключён; Claude CLI требует Node.js 20",
    "Circular import — domain __init__.py ДОЛЖНЫ быть пустыми; импортировать сервисы напрямую"
  ],
  "stats": {
    "routers": 40,
    "domain_modules": 21,
    "repositories": 46,
    "admin_views": 25,
    "background_tasks": 9,
    "domain_events": 8
  }
}

</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

$('#genDate').textContent = DATA.generated;

// stat pills
const stats = DATA.stats;
$('#statPills').innerHTML = Object.entries(stats).map(([k,v]) =>
  `<span class="pill"><b>${v}</b> ${esc(k.replace(/_/g,' '))}</span>`).join('');

const main = $('#main');
const toc = $('#toc');
const sections = [];
function addSection(id, title, color, countLabel, builder) {
  const s = el('section'); s.id = id;
  const t = el('div', 'section-title');
  if (color) { const d = el('span','dot'); d.style.background = color; t.appendChild(d); }
  t.appendChild(el('span', null, esc(title)));
  if (countLabel) t.appendChild(el('span','count', esc(countLabel)));
  s.appendChild(t);
  builder(s);
  main.appendChild(s);
  sections.push({id, title});
  const a = el('a', null, esc(title)); a.href = '#'+id; toc.appendChild(a);
}

// ---- Overview: intro + request flow ----
addSection('overview', 'Обзор', DATA.layers[0].color, null, s => {
  s.appendChild(el('p', 'note', esc(DATA.description)));
  const ep = DATA.entrypoint;
  const flow = el('div','flow');
  flow.style.marginTop = '18px';
  flow.innerHTML = `
    <div class="flow-band"><span class="band-label">Entrypoint · ${esc(ep.framework)} :${ep.port}</span>
      <div class="chips"><span class="chip">${esc(ep.file)}</span></div>
      <p class="note">${esc(ep.role)}</p>
    </div>`;
  const rf = el('div','flow-band');
  rf.innerHTML = `<span class="band-label">Request flow</span>
    <div class="chips" style="align-items:center">
      <span class="chip">User message</span><span class="arrow">→</span>
      <span class="chip">FAQ check (instant)</span><span class="arrow">/</span>
      <span class="chip">LLM (agentic RAG)</span><span class="arrow">→</span>
      <span class="chip">TTS</span><span class="arrow">→</span>
      <span class="chip">Audio response</span>
    </div>`;
  flow.appendChild(rf);
  s.appendChild(flow);

  // deployment modes
  const dm = el('div','panel'); dm.style.marginTop='14px';
  dm.innerHTML = `<h3>Deployment modes · env <code style="font-family:var(--mono);color:#ffa657">${esc(DATA.deployment_modes.env)}</code></h3>`;
  Object.entries(DATA.deployment_modes.modes).forEach(([k,v]) => {
    const kv = el('div','kv'); kv.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`; dm.appendChild(kv);
  });
  s.appendChild(dm);
});

// ---- Layers ----
DATA.layers.forEach(layer => {
  addSection('layer-'+layer.id, layer.title, layer.color, layer.components.length+' компонентов', s => {
    const g = el('div','grid');
    layer.components.forEach(c => {
      const card = el('div','card searchable');
      card.dataset.text = (c.name+' '+(c.file||'')+' '+(c.note||'')+' '+(c.kind||'')).toLowerCase();
      card.innerHTML =
        `<h3>${esc(c.name)}</h3>` +
        (c.kind ? `<span class="kind">${esc(c.kind)}</span>` : '') +
        (c.file ? `<div class="file">${esc(c.file)}</div>` : '') +
        (c.note ? `<p>${esc(c.note)}</p>` : '');
      g.appendChild(card);
    });
    s.appendChild(g);
  });
});

// ---- Domain modules ----
addSection('modules', 'Доменные модули', '#22d3ee', DATA.modules.length+' модулей', s => {
  DATA.modules.forEach(m => {
    const d = el('details','mod searchable');
    d.dataset.text = (m.domain+' '+m.path+' '+m.routers.join(' ')+' '+m.services.join(' ')+' '+m.notes).toLowerCase();
    const routersH = m.routers.length ? m.routers.map(r=>`<span class="tag rtr">${esc(r)}</span>`).join('') : '<span class="note">—</span>';
    const svcsH = m.services.length ? m.services.map(x=>`<span class="tag svc">${esc(x)}</span>`).join('') : '<span class="note">—</span>';
    d.innerHTML =
      `<summary>
        <span class="domain">${esc(m.domain)}</span>
        <span class="path">${esc(m.path)}</span>
        <span class="badges"><span class="badge">${m.routers.length} rtr</span><span class="badge">${m.services.length} svc</span></span>
      </summary>
      <div class="body">
        <div class="lbl">Routers</div>${routersH}
        <div class="lbl">Services</div>${svcsH}
        <div class="note">${esc(m.notes)}</div>
      </div>`;
    s.appendChild(d);
  });
});

// ---- Events + Tasks ----
addSection('events-tasks', 'События и фоновые задачи', '#f472b6', null, s => {
  const two = el('div','two-col');
  const evp = el('div','panel'); evp.innerHTML = `<h3>EventBus · ${esc(DATA.events.bus)}</h3>`;
  DATA.events.domain_events.forEach(e => {
    const kv = el('div','kv searchable'); kv.dataset.text=(e.event+' '+e.source+' '+(e.note||'')).toLowerCase();
    kv.innerHTML = `<span class="k">${esc(e.event)}</span><span class="v">${esc(e.source)}${e.note?' — '+esc(e.note):''}</span>`; evp.appendChild(kv);
  });
  const tp = el('div','panel'); tp.innerHTML = `<h3>TaskRegistry · ${DATA.background_tasks.length} задач</h3>`;
  DATA.background_tasks.forEach(t => {
    const kv = el('div','kv searchable'); kv.dataset.text=(t.name+' '+t.interval+' '+t.fn).toLowerCase();
    kv.innerHTML = `<span class="k">${esc(t.name)}</span><span class="v">${esc(t.interval)} · <span style="color:#79c0ff">${esc(t.fn)}</span></span>`; tp.appendChild(kv);
  });
  two.appendChild(evp); two.appendChild(tp); s.appendChild(two);
});

// ---- RAG ----
addSection('rag', 'RAG / Knowledge', '#34d399', null, s => {
  const p = el('div','panel');
  p.innerHTML = `<h3>Wiki RAG · ${esc(DATA.rag.primary)}</h3>
    <div class="lbl" style="color:var(--text-dim);font-size:11px;text-transform:uppercase;margin-bottom:6px">Tiered search</div>
    <ul class="list">${DATA.rag.tiers.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  const kvs = [
    ['Agentic RAG', DATA.rag.agentic],
    ['Vector Search', `${DATA.rag.vector_search.engine} · :${DATA.rag.vector_search.port} · ${DATA.rag.vector_search.client}`],
    ['Static collections', DATA.rag.static_collections]
  ];
  kvs.forEach(([k,v]) => { const kv=el('div','kv'); kv.style.marginTop='2px'; kv.innerHTML=`<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`; p.appendChild(kv); });
  s.appendChild(p);
});

// ---- Frontend ----
addSection('frontend', 'Фронтенд', '#a78bfa', null, s => {
  const fe = DATA.frontend;
  // admin
  const ap = el('div','panel searchable'); ap.dataset.text=('admin panel vue '+fe.admin_panel.views.join(' ')+' '+fe.admin_panel.stack.join(' ')).toLowerCase();
  ap.innerHTML = `<h3>Admin Panel · ${esc(fe.admin_panel.path)} · ${esc(fe.admin_panel.served_at)}</h3>
    <div class="note" style="margin-bottom:10px">${fe.admin_panel.stack.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
    <div class="lbl" style="color:var(--text-dim);font-size:11px;text-transform:uppercase">Views (${fe.admin_panel.views.length})</div>
    <div style="margin:6px 0">${fe.admin_panel.views.map(v=>`<span class="tag rtr">${esc(v)}</span>`).join('')}</div>
    <div class="kv"><span class="k">API layer</span><span class="v">${esc(fe.admin_panel.api_layer)}</span></div>
    <div class="kv"><span class="k">Variants</span><span class="v">${Object.entries(fe.admin_panel.variants).map(([k,v])=>`<b style="color:#7ee787">${esc(k)}</b>: ${esc(v)}`).join(' · ')}</span></div>`;
  s.appendChild(ap);
  // mobile + landing
  const two = el('div','two-col'); two.style.marginTop='14px';
  const mp = el('div','panel searchable'); mp.dataset.text=('mobile capacitor android '+fe.mobile_app.screens.join(' ')).toLowerCase();
  mp.innerHTML = `<h3>Mobile App · ${esc(fe.mobile_app.path)}</h3>
    <div class="note" style="margin-bottom:8px">${fe.mobile_app.stack.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>
    <div class="kv"><span class="k">Server</span><span class="v">${esc(fe.mobile_app.server_url)} (${esc(fe.mobile_app.size)})</span></div>
    <div class="kv"><span class="k">Screens</span><span class="v">${fe.mobile_app.screens.map(x=>esc(x)).join(', ')}</span></div>
    <div class="kv"><span class="k">Roles</span><span class="v">${esc(fe.mobile_app.role_based)}</span></div>
    <div class="kv"><span class="k">JWT</span><span class="v">${esc(fe.mobile_app.jwt)}</span></div>`;
  const lp = el('div','panel searchable'); lp.dataset.text=('landing site static '+fe.landing.note).toLowerCase();
  lp.innerHTML = `<h3>Landing · ${esc(fe.landing.path)}</h3><p class="note">${esc(fe.landing.note)}</p>`;
  two.appendChild(mp); two.appendChild(lp); s.appendChild(two);
});

// ---- API + Deployment ----
addSection('api-deploy', 'API-конвенции и деплой', '#fbbf24', null, s => {
  const two = el('div','two-col');
  const ap = el('div','panel'); ap.innerHTML = '<h3>API conventions</h3>';
  Object.entries(DATA.api_conventions).forEach(([k,v]) => { const kv=el('div','kv searchable'); kv.dataset.text=(k+' '+v).toLowerCase(); kv.innerHTML=`<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`; ap.appendChild(kv); });
  const dp = el('div','panel'); dp.innerHTML = '<h3>Production deployment</h3>';
  const prod = DATA.deployment.production;
  [['server',prod.server],['manager',prod.manager],['path',prod.path],['nginx',prod.nginx_frontend]].forEach(([k,v])=>{ const kv=el('div','kv'); kv.innerHTML=`<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`; dp.appendChild(kv);});
  dp.appendChild(el('div','lbl',''));
  const ol = el('ul','list'); prod.steps.forEach(st=>{ const li=el('li'); li.innerHTML=`<code>${esc(st)}</code>`; ol.appendChild(li); }); dp.appendChild(ol);
  two.appendChild(ap); two.appendChild(dp); s.appendChild(two);

  const ci = el('div','panel'); ci.style.marginTop='14px';
  ci.innerHTML = `<h3>CI · ${esc(DATA.deployment.ci.file)}</h3>
    <ul class="list">${DATA.deployment.ci.jobs.map(j=>`<li>${esc(j)}</li>`).join('')}</ul>
    <p class="note">${esc(DATA.deployment.ci.branch_protection)}</p>`;
  s.appendChild(ci);
});

// ---- Env + Known issues ----
addSection('env-issues', 'Env-переменные и известные проблемы', '#f87171', null, s => {
  const two = el('div','two-col');
  const ep = el('div','panel'); ep.innerHTML = '<h3>Key env vars</h3>';
  Object.entries(DATA.key_env_vars).forEach(([k,v]) => { const kv=el('div','kv searchable'); kv.dataset.text=(k+' '+v).toLowerCase(); kv.innerHTML=`<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`; ep.appendChild(kv); });
  const ip = el('div','panel'); ip.innerHTML = '<h3>Known issues</h3>';
  const ul = el('ul','list'); DATA.known_issues.forEach(i=>{ const li=el('li','searchable'); li.dataset.text=i.toLowerCase(); li.textContent=i; ul.appendChild(li); }); ip.appendChild(ul);
  two.appendChild(ep); two.appendChild(ip); s.appendChild(two);
});

// ---- Search ----
const searchables = () => Array.from(document.querySelectorAll('.searchable'));
$('#search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const items = searchables();
  if (!q) { items.forEach(i=>i.classList.remove('hidden')); sections.forEach(s=>$('#'+s.id).classList.remove('hidden')); return; }
  items.forEach(i => i.classList.toggle('hidden', !(i.dataset.text||'').includes(q)));
  // hide sections with no visible searchable items (only those that contain searchables)
  sections.forEach(sc => {
    const sec = $('#'+sc.id);
    const inner = sec.querySelectorAll('.searchable');
    if (inner.length === 0) { sec.classList.remove('hidden'); return; }
    const anyVisible = Array.from(inner).some(i=>!i.classList.contains('hidden'));
    sec.classList.toggle('hidden', !anyVisible);
  });
});
</script>
</body>
