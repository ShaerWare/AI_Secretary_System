  <text x="286" y="426" fill="#53bdeb" font-size="11">10:44 ✓✓</text>
</g>

<text x="404" y="44" fill="#8b9bab" font-size="13" letter-spacing="1">TELEGRAM · МЕНЕДЖЕР</text>
<rect x="404" y="62" width="444" height="404" rx="14" fill="#141e29" stroke="#1f2d3b" stroke-dasharray="6 6"/>
