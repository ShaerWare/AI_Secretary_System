</g>
<g class="s0"><circle cx="44" cy="214" r="8" fill="#22c55e"/><path d="M40 214 l3 3 l5 -6" stroke="#0e1621" stroke-width="2" fill="none"/><text x="60" y="219" fill="#c5d0da" font-size="14">вытащил позиции из переписки</text></g><g class="s1"><circle cx="44" cy="242" r="8" fill="#22c55e"/><path d="M40 242 l3 3 l5 -6" stroke="#0e1621" stroke-width="2" fill="none"/><text x="60" y="247" fill="#c5d0da" font-size="14">нашёл каждую в живом каталоге</text></g><g class="s2"><circle cx="44" cy="270" r="8" fill="#22c55e"/><path d="M40 270 l3 3 l5 -6" stroke="#0e1621" stroke-width="2" fill="none"/><text x="60" y="275" fill="#c5d0da" font-size="14">сомнительное — только менеджеру</text></g><g class="s3"><circle cx="44" cy="298" r="8" fill="#22c55e"/><path d="M40 298 l3 3 l5 -6" stroke="#0e1621" stroke-width="2" fill="none"/><text x="60" y="303" fill="#c5d0da" font-size="14">собрал черновик КП</text></g>
