<rect width="880" height="540" rx="18" fill="url(#bg)"/>
<text x="32" y="44" fill="#8b9bab" font-size="13" letter-spacing="1">WHATSAPP · КЛИЕНТ</text>
<g class="c1">
  <rect x="32" y="62" width="310" height="74" rx="12" fill="#1f2c34"/>
