<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"><style>@keyframes c1{0%,1%{opacity:0;transform:translateY(8px)}4%,93%{opacity:1;transform:none}96%,100%{opacity:0}}.c1{opacity:0;animation:c1 14s infinite}@keyframes ty{0%,7%{opacity:0;transform:translateY(8px)}10%,40%{opacity:1;transform:none}43%,100%{opacity:0}}.ty{opacity:0;animation:ty 14s infinite}@keyframes card{0%,39%{opacity:0;transform:translateY(8px)}42%,93%{opacity:1;transform:none}96%,100%{opacity:0}}.card{opacity:0;animation:card 14s infinite}@keyframes s0{0%,11%{opacity:0;transform:translateY(8px)}14%,93%{opacity:1;transform:none}96%,100%{opacity:0}}.s0{opacity:0;animation:s0 14s infinite}@keyframes s1{0%,18%{opacity:0;transform:translateY(8px)}21%,93%{opacity:1;transform:none}96%,100%{opacity:0}}.s1{opacity:0;animation:s1 14s infinite}@keyframes s2{0%,25%{opacity:0;transform:translateY(8px)}28%,93%{opacity:1;transform:none}96%,100%{opacity:0}}.s2{opacity:0;animation:s2 14s infinite}@keyframes s3{0%,32%{opacity:0;transform:translateY(8px)}35%,93%{opacity:1;transform:none}96%,100%{opacity:0}}.s3{opacity:0;animation:s3 14s infinite}@keyframes press{0%,59%{opacity:0;transform:translateY(8px)}62%,70%{opacity:1;transform:none}73%,100%{opacity:0}}.press{opacity:0;animation:press 14s infinite}@keyframes sent{0%,69%{opacity:0;transform:translateY(8px)}72%,93%{opacity:1;transform:none}96%,100%{opacity:0}}.sent{opacity:0;animation:sent 14s infinite}@keyframes c2{0%,73%{opacity:0;transform:translateY(8px)}76%,93%{opacity:1;transform:none}96%,100%{opacity:0}}.c2{opacity:0;animation:c2 14s infinite}@keyframes btn{0%,60%{fill:#2b5278}63%,72%{fill:#3f8bd6}76%,100%{fill:#2b5278}}.btn{animation:btn 14s infinite}@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}.d1{animation:dot 1s infinite}.d2{animation:dot 1s .2s infinite}.d3{animation:dot 1s .4s infinite}.c1,.c2,.card,.s0,.s1,.s2,.s3,.sent{transform-box:fill-box}</style>

<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
