  <text x="522" y="355" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">✓ Отправить</text>
  <rect x="632" y="330" width="200" height="40" rx="8" fill="#2b5278"/>
  <text x="732" y="355" fill="#ffffff" font-size="14" text-anchor="middle">Изменить текст</text>
  <rect x="420" y="378" width="204" height="40" rx="8" fill="#2b5278"/>
  <text x="522" y="403" fill="#ffffff" font-size="14" text-anchor="middle">Отменить</text>
  <rect x="632" y="378" width="200" height="40" rx="8" fill="#2b5278"/>
  <text x="732" y="403" fill="#ffffff" font-size="14" text-anchor="middle">Открыть в PIM</text>
  <g class="press"><circle cx="560" cy="352" r="18" fill="#ffffff" fill-opacity=".18"/>
    <path d="M556 344 l0 22 l6 -6 l4 9 l4 -2 l-4 -9 l8 0 z" fill="#ffffff" stroke="#0e1621" stroke-width="1.2"/></g>
  <g class="sent"><rect x="424" y="430" width="224" height="26" rx="13" fill="#14532d"/>
    <text x="536" y="448" fill="#bbf7d0" font-size="13" text-anchor="middle">✓ КП отправлено клиенту</text></g>
</g>
<path d="M352 256 h38" stroke="#5288c1" stroke-width="2.5"/><path d="M386 249 l10 7 l-10 7 z" fill="#5288c1"/>
<text x="32" y="520" fill="#8b9bab" font-size="14">Клиент попросил КП — через минуту у менеджера готовый черновик, одна кнопка — и он у клиента.</text>

</svg>
