# Nginx configuration for ai-sekretar24.ru landing page
# Deploy: cp landing/nginx-landing.conf /etc/nginx/sites-available/ai-sekretar24-landing
#         ln -sf /etc/nginx/sites-available/ai-sekretar24-landing /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name ai-sekretar24.ru www.ai-sekretar24.ru;
    return 301 https://ai-sekretar24.ru$request_uri;
}

# www -> non-www redirect
server {
    listen 443 ssl http2;
    server_name www.ai-sekretar24.ru;

    ssl_certificate /etc/letsencrypt/live/ai-sekretar24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-sekretar24.ru/privkey.pem;

    return 301 https://ai-sekretar24.ru$request_uri;
}

# Main server block
server {
    listen 443 ssl http2;
    server_name ai-sekretar24.ru;

    ssl_certificate /etc/letsencrypt/live/ai-sekretar24.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-sekretar24.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/ai-secretary/landing;
    index index.html;
    charset utf-8;

    # Clean URLs: /setup/ -> /setup/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Proxy widget requests to the backend (port 8002)
    location /widget.js {
        proxy_pass http://127.0.0.1:8002/widget.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /widget/ {
        proxy_pass http://127.0.0.1:8002/widget/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets aggressively (fonts, images, CSS, JS)
    location ~* \.(css|js|woff|woff2|png|jpg|jpeg|webp|svg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    # No cache for HTML pages (so deploys take effect immediately)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # robots.txt and sitemap.xml
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Deny access to hidden files and WP stubs
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    location = /cgi-bin/php.ini {
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Custom error page
    error_page 404 /index.html;
}
